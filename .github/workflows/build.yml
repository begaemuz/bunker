name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck + build
        run: npm run build
      - name: Logic simulation
        run: npm run sim
        env:
          SIM_HOURS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: dist/index.html
          retention-days: 30
      - name: Publish build branch
        run: |
          mkdir -p /tmp/out && cp dist/index.html /tmp/out/index.html
          cd /tmp/out
          git init -q -b build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Публикация на GitHub Pages (нужно включить Pages в настройках репозитория).
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
