name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck + build
        run: npm run build
      - name: Logic simulation
        run: npm run sim
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: dist/index.html
          retention-days: 30
